    sprite: _KS14/Clothing/OuterClothing/Hardsuits/sitvoid.rsi
  - type: Clothing
    sprite: _KS14/Clothing/OuterClothing/Hardsuits/sitvoid.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetVoidSIT
