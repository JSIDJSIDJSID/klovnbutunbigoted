- type: entity
  parent: [ClothingHandsBase, BaseToggleClothing, BaseSyndicateContraband]
  id: KsClothingHandsGlovesSIT
  name: electro gloves
  description: A pair of advanced electronic gloves meant for altering technology and delivering shocks.
  components:
  - type: Sprite
    sprite: _KS14/Clothing/Hands/Gloves/sitelectro.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _KS14/Clothing/Hands/Gloves/sitelectro.rsi
  - type: Appearance
  - type: ToggleClothingPrefix
    prefixOn: on
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-nanomachines
  - type: FingerprintMask
  - type: ToggleClothing
    action: KsActionToggleSITGloves
    disableOnUnequip: true
  - type: KsSITGloves
    components:
    - type: BatteryDrainer
    - type: StunProvider
      cooldown: 1
      noPowerPopup: ninja-no-power
      whitelist:
        components:
        - Stamina
    - type: EmagProvider
    - type: ResearchStealer
    - type: CommsHacker
      threats: SITThreats
    - type: CriminalRecordsHacker
  - type: Battery #enough charge to stun people twice before a long recharge wait
    maxCharge: 70
    startingCharge: 70
  - type: BatterySelfRecharger
    autoRechargeRate: 1
  - type: ExaminableBattery
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 3.3 #4.95 dps vs fists standard 5, close enough
    animation: WeaponArcFist
  - type: StaminaDamageOnHit
    damage: 20
  - type: Stunbaton
    energyPerUse: 7
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Shock: 5 #7.5 dps
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: GenericVisualizer
    visuals:
     enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
