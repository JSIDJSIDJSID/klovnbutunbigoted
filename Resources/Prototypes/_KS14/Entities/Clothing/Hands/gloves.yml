- type: entity
  parent: [ClothingHandsBase, BaseToggleClothing]
  id: KsClothingHandsGlovesSIT
  name: electro gloves
  description: A pair of advanced electronic gloves meant for altering technology and delivering shocks.
  components:
  - type: Sprite #placeholder
    sprite: Clothing/Hands/Gloves/fingerless.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/fingerless.rsi
  - type: Appearance
#  - type: ToggleClothingPrefix
#    prefixOn: on
  - type: ItemTogglePrefix
    prefixOn: on
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-nanomachines
  - type: FingerprintMask
  - type: ToggleClothing
    action: KsActionToggleSITGloves
    disableOnUnequip: true
  - type: KsSITGloves
    components:
    - type: BatteryDrainer
    - type: StunProvider
      cooldown: 1
      noPowerPopup: ninja-no-power
      whitelist:
        components:
        - Stamina
    - type: EmagProvider
    - type: ResearchStealer
    - type: CommsHacker
      threats: SITThreats
    - type: CriminalRecordsHacker
  - type: Battery #enough charge to stun people twice before a long recharge wait
    maxCharge: 70
    startingCharge: 70
  - type: BatterySelfRecharger
    autoRechargeRate: 1
  - type: ExaminableBattery
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 3.3 #4.95 dps vs fists standard 5, close enough
    animation: WeaponArcFist
  - type: StaminaDamageOnHit
    damage: 20
  - type: Stunbaton
    energyPerUse: 7
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Shock: 5 #7.5 dps
