      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
            Tritium: 40
            Frezon: 40
            Nitrogen: 40
          temperature: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
