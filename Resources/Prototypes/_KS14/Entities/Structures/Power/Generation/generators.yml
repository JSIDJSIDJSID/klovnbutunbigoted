### RTGs
# Advanced
- type: entity
  parent: BaseGenerator
  id: KsGeneratorAdvancedRTG
  name: Advanced RTG
  description: A highly advanced radioisotope thermoelectric generator using plutonium-239.
  suffix: 50kW
  components:
  - type: PowerSupplier
    supplyRate: 50000 #5x output
  - type: Sprite
    sprite: _KS14/Structures/Power/Generation/advancedrtg.rsi
    state: rtg
  - type: PowerMonitoringDevice
    sprite: _KS14/Structures/Power/Generation/advancedrtg.rsi
    state: rtg
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger #Harder to break than the standard rtg
          damage: 800
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 500
        behaviors:
          - !type:SpawnGasBehavior
            gasMixture:
              volume: 100
              moles:
                Tritium: 34.5701689
              temperature: 373.15
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              KsGeneratorAdvancedRTGDamaged:
                min: 1
                max: 1
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

- type: entity
  parent: KsGeneratorAdvancedRTG
  id: KsGeneratorAdvancedRTGDamaged
  name: damaged RTG
  description: A highly advanced radioisotope thermoelectric generator using plutonium-239. This one has damaged shielding.
  suffix: 50kW
  components:
  - type: PowerSupplier
    supplyRate: 15000
  - type: Sprite
    sprite: _KS14/Structures/Power/Generation/advancedrtg.rsi
    layers:
      - state: rtg_damaged
      - state: rtg_glow
  - type: PowerMonitoringDevice
    sprite: _KS14/Structures/Power/Generation/advancedrtg.rsi
    state: rtg_damaged
  - type: RadiationSource
    intensity: 4 #Twice as worse
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 100
          moles:
            Tritium: 34.5701689
          temperature: 373.15
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
          SheetUranium1:
            min: 10
            max: 20
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

