# Alien
- type: entity
  parent: KsGeneratorAdvancedSyndicateRTG
  id: KsGeneratorAdvancedAlienRTG #For abductors or otherwise alien visitors
  name: Void Core
  description: An odd-looking... generator? Made from a mysterious material.
  suffix: 200kW, DEBUG, DoNotMap
  components:
  - type: PowerSupplier
    supplyRate: 200000 #20x output
  - type: Sprite
    sprite: _KS14/Structures/Power/Generation/voidcore.rsi
    state: rtg
  - type: PowerMonitoringDevice
    sprite: _KS14/Structures/Power/Generation/voidcore.rsi
    state: rtg
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 1000
        behaviors:
          - !type:SpawnGasBehavior
            gasMixture:
              volume: 1000
              moles:
                Tritium: 20
                Frezon: 20
                Nitrogen: 20
              temperature: 1
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              KsGeneratorAdvancedAlienRTGDamaged:
                min: 1
                max: 1
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: Contraband
    severity: Magical

- type: entity
  parent: KsGeneratorAdvancedAlienRTG
  id: KsGeneratorAdvancedAlienRTGDamaged
  name: damaged RTG
  description: An odd-looking... generator? Made from a mysterious material. This one has damaged shielding.
  suffix: 200kW
  components:
  - type: PowerSupplier
    supplyRate: 50000
  - type: Sprite
    sprite: _KS14/Structures/Power/Generation/voidcore.rsi
